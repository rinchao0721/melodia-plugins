name: 校验插件发布产物

on:
  pull_request:
    paths:
      - index.json
      - '**/*.melodiaplugin'
      - .github/scripts/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验插件包与目录一致性
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_plugins.py
