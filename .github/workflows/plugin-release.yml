name: 发布插件 Release

on:
  push:
    branches: [main]
    paths:
      - index.json
      - '**/*.melodiaplugin'
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验并发布插件 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_plugins.py --publish
